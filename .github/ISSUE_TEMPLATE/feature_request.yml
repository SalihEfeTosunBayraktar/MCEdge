name: Feature request
description: Suggest something MCEdge should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or mod feature you cannot do, or find hard to do, today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like MCEdge to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
